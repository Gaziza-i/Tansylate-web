name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Start deploy in background
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            echo "running" > /var/www/deploy.status
            nohup bash -c '
              set -e
              trap "echo failed > /var/www/deploy.status" ERR
              cd /var/www/tansylate
              git pull origin main
              npm run build
              test -f dist/public/index.html
              set -a && source .env && set +a
              pm2 restart 0 --update-env
              pm2 save
              echo success > /var/www/deploy.status
            ' > /var/www/deploy.log 2>&1 &
            disown
            echo "Deploy started in background"

      # The build takes several minutes on this VPS, and holding a single SSH
      # connection open that long has been unreliable (connection reset mid-build).
      # So the build above runs detached (nohup) and this step polls its status
      # with short, separate SSH connections instead of one long-lived one.
      - name: Wait for deploy to finish
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          PORT="${SSH_PORT:-22}"
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          ssh_cmd() {
            ssh -i ~/.ssh/deploy_key -p "$PORT" -o ConnectTimeout=15 -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" "$1"
          }

          for i in $(seq 1 90); do
            status=$(ssh_cmd 'cat /var/www/deploy.status 2>/dev/null || echo running')
            echo "[$i/90] status=$status"
            if [ "$status" = "success" ]; then
              echo "✅ Deploy succeeded"
              exit 0
            fi
            if [ "$status" != "running" ]; then
              echo "❌ Deploy failed. Last 150 lines of log:"
              ssh_cmd 'tail -150 /var/www/deploy.log'
              exit 1
            fi
            sleep 10
          done

          echo "❌ Timed out waiting for deploy. Last 150 lines of log:"
          ssh_cmd 'tail -150 /var/www/deploy.log'
          exit 1
